name: Pages

# Rebuilds the static mirror from committed editions and current templates.
# This workflow never fetches new sources or changes an edition.
# Pages must be enabled with the "GitHub Actions" build type.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pitboard/**"
      - "assets/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          distribution: full
      - name: Install rendering dependencies
        run: raco pkg install --auto --no-docs http-easy server-sent-events feed
      - name: Install pitboard
        run: raco pkg install --auto --no-docs --link "$PWD"
      - name: Rebuild from committed editions
        run: raco pitboard export --data data --out site --domain pitboard.jrtx.site
      - name: Check exported text for template leaks
        run: python3 scripts/check-exported-template-leaks.py --root site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
